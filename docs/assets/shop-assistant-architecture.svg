<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1376" viewBox="0 0 1680 1376" role="img" aria-labelledby="title desc">
<title id="title">Shop Assistant — system architecture</title><desc id="desc">Current implementation of a self-hosted multi-tenant café ordering assistant. Website, Telegram and voice enter a Django application. Published tenant configuration governs a LangGraph conversation workflow, with OpenAI model calls, lexical knowledge retrieval, an optional FAISS answer cache, deterministic ordering and signed external commerce adapters. PostgreSQL, Redis and Celery provide persistence and background operations.</desc>
