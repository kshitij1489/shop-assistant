<marker id="dim-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 9 1 L 1 5 L 9 9" fill="none" stroke="#606D6C" stroke-width="1.5"/></marker>
</defs><g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1680" height="1120" rx="0" fill="#F7F5EF" />
<rect x="0" y="0" width="1680" height="1120" rx="0" fill="url(#glow)" />
<rect x="0" y="0" width="1680" height="1120" rx="0" fill="url(#grid)" />
<text x="48" y="52" font-size="15" fill="#126C74" font-weight="700" letter-spacing="2">CONVERSATION DESIGN</text>
<text x="48" y="111" font-size="46" fill="#293D42" font-weight="700" >One turn. Explicit control.</text>
<text x="48" y="153" font-size="25" fill="#526365" font-weight="400" >A stateful AI workflow with deterministic business boundaries</text>
<text x="48" y="215" font-size="15" fill="#126C74" font-weight="700" letter-spacing="2">01 / RECEIVE &amp; INTERPRET</text>
<text x="1092" y="215" font-size="15" fill="#276749" font-weight="700" letter-spacing="2">02 / RESOLVE &amp; EXECUTE</text>
<rect x="48" y="249" width="290" height="195" rx="16" fill="#F1F8F7" stroke="#CCD8D4" />
<rect x="68" y="271" width="4" height="25" rx="2" fill="#126C74" />
<text x="86" y="292" font-size="22" fill="#293D42" font-weight="700" >Authenticate &amp; load</text>
<text x="72" y="330" font-size="20" fill="#526365" font-weight="400" >Resolve tenant + customer</text>
<text x="72" y="359" font-size="20" fill="#526365" font-weight="400" >Acquire the session lock</text>
<text x="72" y="388" font-size="20" fill="#526365" font-weight="400" >Load state + live config</text>
<text x="72" y="423" font-size="16" fill="#126C74" font-weight="600" >Preserve pending work</text>
<rect x="392" y="249" width="290" height="195" rx="16" fill="#F6F1FB" stroke="#CCD8D4" />
<rect x="412" y="271" width="4" height="25" rx="2" fill="#71539A" />
<text x="430" y="292" font-size="22" fill="#293D42" font-weight="700" >Interpret the request</text>
<text x="416" y="330" font-size="20" fill="#526365" font-weight="400" >Explicit command or LLM</text>
<text x="416" y="359" font-size="20" fill="#526365" font-weight="400" >Typed action proposals</text>
<text x="416" y="388" font-size="20" fill="#526365" font-weight="400" >English search rewrite</text>
<text x="416" y="423" font-size="16" fill="#71539A" font-weight="600" >Retain customer reply language</text>
<rect x="736" y="249" width="302" height="195" rx="16" fill="#F0F7F1" stroke="#CCD8D4" />
<rect x="756" y="271" width="4" height="25" rx="2" fill="#276749" />
<text x="774" y="292" font-size="22" fill="#293D42" font-weight="700" >Resolve &amp; authorize</text>
<text x="760" y="330" font-size="20" fill="#526365" font-weight="400" >Bind references to IDs</text>
<text x="760" y="359" font-size="20" fill="#526365" font-weight="400" >Check enabled capabilities</text>
<text x="760" y="388" font-size="20" fill="#526365" font-weight="400" >Reject or clarify ambiguity</text>
<text x="760" y="423" font-size="16" fill="#276749" font-weight="600" >Each proposal, in user order</text>
<path d="M 338 337 H 392" fill="none" stroke="#126C74" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 383 333 L 392 337 L 383 341" fill="none" stroke="#126C74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 682 337 H 736" fill="none" stroke="#126C74" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 727 333 L 736 337 L 727 341" fill="none" stroke="#126C74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1092" y="249" width="540" height="151" rx="16" fill="#F6F1FB" stroke="#CCD8D4" />
<rect x="1112" y="271" width="4" height="25" rx="2" fill="#71539A" />
<text x="1130" y="292" font-size="23" fill="#293D42" font-weight="700" >Knowledge handlers</text>
<text x="1116" y="330" font-size="20" fill="#526365" font-weight="400" >Published evidence → whole-set / lexical retrieval</text>
<text x="1116" y="359" font-size="20" fill="#526365" font-weight="400" >Evidence-grounded answers · eligible answer reuse</text>
<rect x="1092" y="464" width="540" height="166" rx="16" fill="#F0F7F1" stroke="#CCD8D4" />
<rect x="1112" y="486" width="4" height="25" rx="2" fill="#276749" />
<text x="1130" y="507" font-size="23" fill="#293D42" font-weight="700" >Business handlers</text>
<text x="1116" y="545" font-size="20" fill="#526365" font-weight="400" >Catalog / basket → validated quote → checkout</text>
<text x="1116" y="574" font-size="20" fill="#526365" font-weight="400" >Pricing, stock &amp; original-text order confirmation</text>
<text x="1116" y="609" font-size="16" fill="#276749" font-weight="600" >Accepted orders enter the commerce ledger</text>
<path d="M 1038 325 H 1092" fill="none" stroke="#71539A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1083 321 L 1092 325 L 1083 329" fill="none" stroke="#71539A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1038 360 H 1062 V 532 H 1092" fill="none" stroke="#276749" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1083 528 L 1092 532 L 1083 536" fill="none" stroke="#276749" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1068" y="426" font-size="16" fill="#606D6C" font-weight="400" >allowed routes</text>
<rect x="392" y="479" width="290" height="80" rx="12" fill="#FFF3E2" stroke="#DFC29A" />
<text x="412" y="510" font-size="20" fill="#965512" font-weight="700" >Invalid classification</text>
<text x="412" y="539" font-size="17" fill="#526365" font-weight="400" >End turn; do not save proposals</text>
<path d="M 537 444 V 479" fill="none" stroke="#965512" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 541 470 L 537 479 L 533 470" fill="none" stroke="#965512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="736" y="479" width="302" height="80" rx="12" fill="#FFF7EA" stroke="#CCD8D4" />
<text x="756" y="510" font-size="17" fill="#965512" font-weight="700" >Unavailable / needs clarification</text>
<text x="756" y="539" font-size="17" fill="#526365" font-weight="400" >Record outcome; skip the action</text>
<path d="M 887 444 V 479" fill="none" stroke="#965512" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 891 470 L 887 479 L 883 470" fill="none" stroke="#965512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="48" y="676" font-size="15" fill="#126C74" font-weight="700" letter-spacing="2">03 / COLLECT, RENDER &amp; COMMIT</text>
<rect x="1092" y="714" width="540" height="174" rx="16" fill="#F0F7F1" stroke="#CCD8D4" />
<rect x="1112" y="736" width="4" height="25" rx="2" fill="#276749" />
<text x="1130" y="757" font-size="23" fill="#293D42" font-weight="700" >Collect verified outcomes</text>
<text x="1116" y="795" font-size="20" fill="#526365" font-weight="400" >Record handler results; advance to the next request</text>
<text x="1116" y="824" font-size="20" fill="#526365" font-weight="400" >Select one follow-up; preserve unfinished work</text>
<text x="1116" y="867" font-size="16" fill="#276749" font-weight="600" >No remaining requests → compose the final reply</text>
<path d="M 1632 324 H 1656 V 674 H 1488 V 714" fill="none" stroke="#71539A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1492 705 L 1488 714 L 1484 705" fill="none" stroke="#71539A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1362 630 V 714" fill="none" stroke="#276749" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1366 705 L 1362 714 L 1358 705" fill="none" stroke="#276749" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 887 559 V 686 H 1212 V 714" fill="none" stroke="#965512" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1216 705 L 1212 714 L 1208 705" fill="none" stroke="#965512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 1092 754 H 1057 V 600 H 901 M 873 600 H 710 V 410 H 736" fill="none" stroke="#606D6C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 7"/>
<path d="M 727 406 L 736 410 L 727 414" fill="none" stroke="#606D6C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="737" y="630" font-size="15" fill="#606D6C" font-weight="400" >next request</text>
<rect x="548" y="714" width="490" height="174" rx="16" fill="#F6F1FB" stroke="#CCD8D4" />
<rect x="568" y="736" width="4" height="25" rx="2" fill="#71539A" />
<text x="586" y="757" font-size="23" fill="#293D42" font-weight="700" >Render &amp; validate the reply</text>
<text x="572" y="795" font-size="20" fill="#526365" font-weight="400" >Structured composition in the customer language</text>
<text x="572" y="824" font-size="20" fill="#526365" font-weight="400" >Check numbers, URLs &amp; the delivered question</text>
<text x="572" y="867" font-size="16" fill="#71539A" font-weight="600" >On failure: retain the verified handler reply</text>
<rect x="48" y="714" width="446" height="174" rx="16" fill="#F1F8F7" stroke="#CCD8D4" />
<rect x="68" y="736" width="4" height="25" rx="2" fill="#126C74" />
<text x="86" y="757" font-size="23" fill="#293D42" font-weight="700" >Save &amp; deliver</text>
<text x="72" y="795" font-size="20" fill="#526365" font-weight="400" >Persist the scoped session snapshot</text>
<text x="72" y="824" font-size="20" fill="#526365" font-weight="400" >Web: authoritative SSE done / JSON</text>
<text x="72" y="853" font-size="20" fill="#526365" font-weight="400" >Queued channels: adapter reply</text>
<path d="M 1092 807 H 1038" fill="none" stroke="#126C74" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1047 811 L 1038 807 L 1047 803" fill="none" stroke="#126C74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 548 807 H 494" fill="none" stroke="#126C74" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 503 811 L 494 807 L 503 803" fill="none" stroke="#126C74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="48" y="940" width="1584" height="114" rx="14" fill="#FFFFFF" stroke="#CCD8D4" />
<text x="72" y="978" font-size="21" fill="#293D42" font-weight="700" >AI proposes; code authorizes</text>
<text x="72" y="1009" font-size="18" fill="#526365" font-weight="400" >Model text cannot enable a capability</text>
<text x="72" y="1034" font-size="18" fill="#526365" font-weight="400" >or create checkout consent.</text>
<text x="602" y="978" font-size="21" fill="#293D42" font-weight="700" >Retry the provider call only</text>
<text x="602" y="1009" font-size="18" fill="#526365" font-weight="400" >Graph nodes have no retry policy;</text>
<text x="602" y="1034" font-size="18" fill="#526365" font-weight="400" >reply fallback does not replay an order.</text>
<text x="1134" y="978" font-size="21" fill="#293D42" font-weight="700" >Session commit ≠ order transaction</text>
<text x="1134" y="1009" font-size="18" fill="#526365" font-weight="400" >Checkout can commit before the response;</text>
<text x="1134" y="1034" font-size="18" fill="#526365" font-weight="400" >an interrupted turn must not auto-replay.</text>
<text x="48" y="1093" font-size="13" fill="#606D6C" font-weight="700" letter-spacing="1.5">SHOP-ASSISTANT / SIMPLIFIED RUNTIME FLOW</text>
<text x="1632" y="1093" font-size="15" fill="#606D6C" font-weight="400" text-anchor="end">LangGraph routes one active node at a time; session stores own persistence.</text>
</g></svg>
