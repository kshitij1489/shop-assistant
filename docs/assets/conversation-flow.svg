<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" role="img" aria-labelledby="title desc">
<title id="title">Shop Assistant — conversation turn design</title><desc id="desc">A simplified conversation turn: authenticate and load scoped state, interpret structured proposals, resolve and authorize each proposal, execute knowledge or business handlers, collect outcomes, choose a follow-up, render and validate a reply, and save the session before delivering the authoritative response. Invalid classification exits without saving proposed state. Unavailable or ambiguous actions produce an outcome without executing the proposed operation. Provider retries do not replay business operations.</desc>
<defs><radialGradient id="glow" cx="75%" cy="0%" r="80%"><stop offset="0" stop-color="#E1EDE6" stop-opacity=".65"/><stop offset="1" stop-color="#F7F5EF" stop-opacity="0"/></radialGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".75" fill="#8DA49D" opacity=".12"/></pattern>
<marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#126C74" stroke-width="1.5"/></marker>
<marker id="cyan-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 9 1 L 1 5 L 9 9" fill="none" stroke="#126C74" stroke-width="1.5"/></marker>
<marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#71539A" stroke-width="1.5"/></marker>
<marker id="violet-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 9 1 L 1 5 L 9 9" fill="none" stroke="#71539A" stroke-width="1.5"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#276749" stroke-width="1.5"/></marker>
<marker id="green-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 9 1 L 1 5 L 9 9" fill="none" stroke="#276749" stroke-width="1.5"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#965512" stroke-width="1.5"/></marker>
<marker id="amber-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 9 1 L 1 5 L 9 9" fill="none" stroke="#965512" stroke-width="1.5"/></marker>
