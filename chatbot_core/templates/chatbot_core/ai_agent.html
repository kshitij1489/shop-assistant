{% extends "chatbot_core/chat_base.html" %}
{% load static %}
{% block title %}ChatBot – ChatWise AI{% endblock %}

{% block content %}
<section class="chatbot-container">
  <div class="chat-window" id="chat-window" role="log" aria-label="Conversation" aria-live="off" tabindex="0">
    <div class="message bot">Hi there! I'm your AI Assistant. How can I help today?</div>
  </div>

  <form class="chat-form" id="chat-form">
    <label class="visually-hidden" for="message-input">Message to assistant</label>
    <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off" required />
    <button type="submit">Send</button>
  </form>
  <div id="reply-announcement" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
</section>
{% endblock %}

{% block extra_scripts %}
<script src="{% static 'chatbot_core/js/chat_stream.js' %}"></script>
<div id="chat-config" hidden data-tenant-slug="{{ tenant_slug }}"
     data-token-url="{{ token_url }}" data-chatbot-endpoint="{{ chatbot_endpoint }}"
     data-tenant-api-key="{{ tenant_api_key }}"></div>
<script src="{% static 'chatbot_core/js/ai_agent.js' %}"></script>
{% endblock %}
